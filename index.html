<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Für dich ❤️</title>
<style>

body {

    margin: 0;

    padding: 0;

    overflow: hidden;

    font-family: 'Segoe UI', sans-serif;

    background: linear-gradient(135deg, #ff9aa2, #ffc3a0);

    text-align: center;

    color: white;

}

h1 {

    margin-top: 80px;

    font-size: 45px;

    text-shadow: 0 0 20px rgba(255,255,255,0.8);

}

h2 {

    font-size: 55px;

    margin: 10px 0;

    text-shadow: 0 0 30px rgba(255,0,0,0.7);

}

p {

    position: absolute;

    bottom: 40px;

    width: 100%;

    font-size: 18px;

    padding: 0 20px;

}

/* Button */

button {

    margin-top: 20px;

    padding: 15px 35px;

    border: none;

    border-radius: 50px;

    background: #ff4b7d;

    color: white;

    font-size: 18px;

    cursor: pointer;

    box-shadow: 0 0 20px rgba(255,75,125,0.8);

    transition: 0.3s;

}

button:hover {

    transform: scale(1.1);

    box-shadow: 0 0 40px rgba(255,75,125,1);

}

/* Falling Elements */

.falling {

    position: fixed;

    top: -50px;

    font-size: 24px;

    animation: fall linear infinite;

}

@keyframes fall {

    to {

        transform: translateY(110vh);

    }

}
</style>
</head>
<body>
<h1>Für immer zusammen 💞</h1>
<h2>Arda ❤️ Tuana</h2>
<button onclick="showMessage()">Klick hier mein Herz 💖</button>
<p id="loveText" style="display:none;">

Iyiki varsin birtanem, bu cicekler herseyin en iyisini hak eden ve dünyanin en güzel kizi icin❤️🫶🌹
</p>
<script>

// Überraschungsnachricht

function showMessage() {

    document.getElementById("loveText").style.display = "block";

}

// Herzen & Blumen erstellen

function createFallingElement() {

    const element = document.createElement("div");

    element.classList.add("falling");

    const symbols = ["❤️","💖","💘","🌸","🌹","🌷"];

    element.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];

    element.style.left = Math.random() * 100 + "vw";

    element.style.animationDuration = (Math.random() * 3 + 4) + "s";

    element.style.fontSize = (Math.random() * 20 + 20) + "px";

    document.body.appendChild(element);

    setTimeout(() => {

        element.remove();

    }, 7000);

}

setInterval(createFallingElement, 300);
</script>
</body>
</html>
